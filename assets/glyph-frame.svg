<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96"
     class="term-glyph term-glyph-frame" role="img" aria-label="Corner frame mark">
  <!-- The frame mark: four corner brackets and no sides, which is the shape a
       box-drawing character set makes when only the corners are set. The gap
       between the arms is what carries it. Closed into a full rectangle it
       becomes a border and stops being a mark.

       Each arm runs 26 units from a corner inset 12 units from the edge, so the
       open span on every side is 20 units. Equal gaps matter here: unequal ones
       read as a rectangle that failed to render.

       Stroke only, so it takes its color from the surrounding text unless
       components/glow.css overrides it. -->
  <g class="term-art-line" fill="none" stroke="currentColor" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 38 L 12 12 L 38 12" />
    <path d="M58 12 L 84 12 L 84 38" />
    <path d="M84 58 L 84 84 L 58 84" />
    <path d="M38 84 L 12 84 L 12 58" />
  </g>
</svg>
